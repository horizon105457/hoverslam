[project]
name = "coldgas"
version = "0.1.0"
description = "Cold-gas thruster flight twin of the 坠 · FALL MINI EV (Python mirror of src/flight): rigid 6-DOF twin, tasks, envs, controllers, benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
rl = ["gymnasium>=1.0", "torch>=2.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coldgas", "coldgas.controllers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
